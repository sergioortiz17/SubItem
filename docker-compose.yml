services:
  postgres:
    image: postgres:15-alpine
    container_name: roadmap-subitem-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roadmap_subitem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roadmap-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadmap-subitem-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: roadmap_subitem
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - roadmap-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roadmap-subitem-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - roadmap-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  roadmap-network:
    driver: bridge


